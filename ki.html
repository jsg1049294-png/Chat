<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>KI Assistant</title>
<style>
  body { margin:0; padding:0; background:#0a0a0f; color:#e8e8f0; font-family: 'Syne', system-ui; height:100vh; overflow:hidden; }
  #chat { display:flex; flex-direction:column; height:100vh; }
  #messages { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px; }
  .bubble { max-width:85%; padding:14px 18px; border-radius:18px; line-height:1.5; }
  .user { align-self:flex-end; background:#00ff88; color:#000; border-bottom-right-radius:6px; }
  .ai { align-self:flex-start; background:#1a1a26; border:1px solid #333; border-bottom-left-radius:6px; }
  #input-area { padding:15px; background:#111; display:flex; gap:10px; }
  #user-input { flex:1; padding:14px; border-radius:12px; border:none; background:#222; color:white; font-size:16px; }
  button { padding:0 24px; background:#00ff88; color:black; border:none; border-radius:12px; font-weight:bold; cursor:pointer; }
</style>
</head>
<body>

<div id="chat">
  <div id="messages"></div>
  <div id="input-area">
    <input id="user-input" placeholder="Nachricht an die KI..." autocomplete="off">
    <button onclick="sendToAI()">Senden</button>
  </div>
</div>

<script>
// ================== HIER DEINEN OPENROUTER KEY EINFÜGEN ==================
const API_KEY = "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";   // ← Hier deinen OpenRouter Key eintragen!
// =====================================================================

const messagesDiv = document.getElementById("messages");
const input = document.getElementById("user-input");

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = `bubble ${type}`;
  div.textContent = text;
  messagesDiv.appendChild(div);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

async function sendToAI() {
  const text = input.value.trim();
  if (!text) return;

  if (API_KEY.length < 20) {
    addMessage("❌ Bitte zuerst deinen OpenRouter API-Key in ki.html eintragen!", "ai");
    return;
  }

  addMessage(text, "user");
  input.value = "";

  const loading = document.createElement("div");
  loading.className = "bubble ai";
  loading.textContent = "KI denkt nach...";
  messagesDiv.appendChild(loading);

  try {
    const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${API_KEY}`,
        "HTTP-Referer": "https://globalchat.com",
        "X-Title": "GlobalChat"
      },
      body: JSON.stringify({
        model: "openrouter/free",     // Kostenloses Modell
        messages: [{ role: "user", content: text }]
      })
    });

    const data = await res.json();
    loading.remove();

    if (!res.ok) {
      addMessage("❌ Fehler: " + (data.error?.message || "Ungültiger Key"), "ai");
    } else {
      addMessage(data.choices[0].message.content, "ai");
    }

  } catch (e) {
    loading.remove();
    addMessage("❌ Keine Verbindung möglich.", "ai");
  }
}

input.addEventListener("keypress", e => { if (e.key === "Enter") sendToAI(); });
addMessage("✅ OpenRouter KI geladen. Schreib mir etwas!", "ai");
</script>
</body>
</html>
