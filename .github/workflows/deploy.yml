name: Deploy GlobalChat

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Replace GitHub Secret in ki.html
        run: |
          sed -i 's|{{KEY}}|${{ secrets.KEY }}|g' ki.html

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: .
