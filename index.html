<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlobalChat</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f; --surface: #12121a; --surface2: #1a1a26;
    --accent: #00ff88; --accent2: #ff3366; --warn: #ffaa00;
    --text: #e8e8f0; --text-muted: #6666aa; --border: #2a2a40; --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Syne', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow: hidden; }
  
  .screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 10; transition: opacity 0.4s; }
  .screen.hidden { opacity: 0; pointer-events: none; }
  
  .pin-card, .user-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 48px 40px; width: 360px; text-align: center; }
  .logo { font-size: 13px; letter-spacing: 0.3em; color: var(--accent); text-transform: uppercase; }
  
  .pin-dots { display: flex; justify-content: center; gap: 14px; margin: 32px 0; }
  .pin-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border); }
  .pin-dot.filled { background: var(--accent); border-color: var(--accent); }
  
  .messages-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 75%; }
  .msg.own { align-self: flex-end; }
  .msg.other { align-self: flex-start; }
  .msg-bubble { padding: 12px 16px; border-radius: 18px; font-size: 14.5px; line-height: 1.4; }
  .msg.other .msg-bubble { background: var(--surface2); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.own .msg-bubble { background: linear-gradient(135deg, #1a3a2a, #0f2a1a); border: 1px solid rgba(0,255,136,0.4); border-bottom-right-radius: 4px; }
  
  .chat-input-area { padding: 14px 20px; background: var(--surface); border-top: 1px solid var(--border); display: flex; gap: 10px; }
  .chat-input { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; color: white; resize: none; max-height: 120px; }
  .send-btn { background: var(--accent); color: black; width: 48px; height: 48px; border-radius: 12px; font-size: 20px; }
</style>
</head>
<body>

<div class="screen" id="pin-screen"> ... (PIN Screen wie vorher) </div>
<div class="screen hidden" id="user-screen"> ... (Username Screen) </div>

<div class="screen hidden" id="chat-screen" style="flex-direction:column">
  <div class="chat-header"> ... (Header) </div>
  
  <div class="messages-container" id="messages"></div>
  
  <div class="chat-input-area">
    <textarea class="chat-input" id="chat-input" placeholder="Nachricht schreiben..." onkeydown="handleKey(event)"></textarea>
    <button class="send-btn" onclick="sendMessage()">➤</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script>
// DEINE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyBYcwvQazKQxBQjdWqn4wLY-3SA3A4scng",
  authDomain: "globalchat-2026.firebaseapp.com",
  projectId: "globalchat-2026",
  storageBucket: "globalchat-2026.firebasestorage.app",
  messagingSenderId: "510911567824",
  appId: "1:510911567824:web:d95c7e0c5a88501fa3cbd5"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let currentUser = '', isAdmin = false, unsubscribe = null;

// === PIN & Username Teil (vereinfacht) ===
function checkPin() {
  const p = prompt("PIN eingeben (6969):") || '';
  if (p === '6969' || p === '6767' || p === '7676') {
    isAdmin = (p !== '6969');
    currentUser = isAdmin ? 'Admin' : prompt("Dein Name:") || "User";
    document.getElementById('chat-screen').classList.remove('hidden');
    document.getElementById('pin-screen').classList.add('hidden');
    initChat();
  }
}

async function initChat() {
  const container = document.getElementById('messages');
  
  unsubscribe = db.collection('messages').orderBy('time', 'asc')
    .onSnapshot(snapshot => {
      container.innerHTML = '';
      
      snapshot.forEach(doc => {
        const m = doc.data();
        const div = document.createElement('div');
        div.className = `msg ${m.user === currentUser ? 'own' : 'other'}`;
        div.innerHTML = `
          <small>${m.user} • ${new Date(m.time).toLocaleTimeString('de-DE')}</small><br>
          <div class="msg-bubble">${m.text}</div>
        `;
        container.appendChild(div);
      });
      
      container.scrollTop = container.scrollHeight;
    });
}

async function sendMessage() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;
  
  try {
    await db.collection('messages').add({
      user: currentUser,
      text: text,
      time: Date.now()
    });
    input.value = '';
  } catch(e) {
    alert("Fehler beim Senden: " + e.message);
  }
}

function handleKey(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

// Start
window.onload = () => checkPin();
</script>
</body>
</html>
