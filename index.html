<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GlobalChat</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f; --surface: #12121a; --surface2: #1a1a26;
    --accent: #00ff88; --accent2: #ff3366;
    --text: #e8e8f0; --border: #2a2a40;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Syne',sans-serif; background:var(--bg); color:var(--text); height:100vh; overflow:hidden; }

  .chat-screen { display:flex; flex-direction:column; height:100vh; }
  .chat-header { background:var(--surface); padding:12px 16px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); font-size:15px; }
  
  .messages-container { 
    flex:1; 
    overflow-y:auto; 
    padding:16px; 
    display:flex; 
    flex-direction:column; 
    gap:12px; 
    background:var(--bg); 
    max-width: 720px; 
    margin: 0 auto; 
    width: 100%;
  }
  
  .msg { max-width: 82%; }
  .msg.own { align-self: flex-end; }
  .msg.other { align-self: flex-start; }
  
  .msg-bubble { 
    padding: 13px 17px; 
    border-radius: 18px; 
    font-size: 15.5px; 
    line-height: 1.45; 
    word-break: break-word; 
  }
  .msg.other .msg-bubble { background: var(--surface2); border: 1px solid var(--border); border-bottom-left-radius: 6px; }
  .msg.own .msg-bubble { background: linear-gradient(135deg, #1a3a2a, #0f2a1a); border: 1px solid rgba(0,255,136,0.4); border-bottom-right-radius: 6px; }
  
  .chat-input-area { 
    background: var(--surface); 
    border-top: 1px solid var(--border); 
    padding: 12px 16px; 
    display: flex; 
    gap: 10px; 
    max-width: 720px; 
    margin: 0 auto; 
    width: 100%;
  }
  .chat-input { 
    flex: 1; 
    background: var(--surface2); 
    border: 1px solid var(--border); 
    border-radius: 16px; 
    color: var(--text); 
    padding: 14px 18px; 
    font-size: 16px; 
    resize: none; 
    max-height: 160px; 
  }
  .send-btn { 
    background: var(--accent); 
    color: #000; 
    width: 52px; 
    height: 52px; 
    border-radius: 16px; 
    font-size: 22px; 
  }

  #iframe-container { 
    position: fixed; 
    inset: 0; 
    background: rgba(0,0,0,0.96); 
    z-index: 100; 
    display: none; 
    flex-direction: column; 
  }
  #iframe-container iframe { flex: 1; border: none; }
  .iframe-header { padding: 12px 16px; background: #111; display: flex; justify-content: space-between; align-items: center; }
</style>
</head>
<body>

<div class="chat-screen" id="chat-screen">
  <div class="chat-header">
    <div><strong>GlobalChat</strong> <span style="color:#00ff88">●</span></div>
    <div style="display:flex; align-items:center; gap:10px;">
      <span id="display-user" style="font-size:14px;"></span>
      <button onclick="logout()" style="background:#222; border:none; color:#aaa; padding:5px 11px; border-radius:8px; font-size:13px;">Abmelden</button>
      <button id="admin-clear" onclick="confirmClearAll()" style="display:none; background:#ff3366; color:white; border:none; padding:5px 11px; border-radius:8px; font-size:13px;">Alles löschen</button>
    </div>
  </div>
  
  <div class="messages-container" id="messages"></div>
  
  <div class="chat-input-area">
    <textarea id="chat-input" class="chat-input" placeholder="Nachricht... (/my, /mj)" onkeydown="handleKey(event)"></textarea>
    <button class="send-btn" onclick="sendMessage()">➤</button>
  </div>
</div>

<!-- iFrame -->
<div id="iframe-container">
  <div class="iframe-header">
    <span id="iframe-title">My Instance</span>
    <button onclick="closeIframe()" style="background:#ff3366; color:white; border:none; padding:8px 16px; border-radius:8px;">Schließen ✕</button>
  </div>
  <iframe id="main-iframe" src=""></iframe>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script>
// Deine Config
const firebaseConfig = {
  apiKey: "AIzaSyBYcwvQazKQxBQjdWqn4wLY-3SA3A4scng",
  authDomain: "globalchat-2026.firebaseapp.com",
  projectId: "globalchat-2026",
  storageBucket: "globalchat-2026.firebasestorage.app",
  messagingSenderId: "510911567824",
  appId: "1:510911567824:web:d95c7e0c5a88501fa3cbd5"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let currentUser = "", isAdmin = false, unsubscribe = null;

const slashCommands = {
  "/my": { url: "https://www.myinstants.com/de/index/de/" },   // ← Hier deine URL eintragen
  "/mj": { url: "https://www.myinstants.com/de/index/de/", title: "Midjourney" }
};

window.onload = () => {
  const pin = prompt("PIN eingeben (6969):");
  if (!["6969","6767","7676"].includes(pin)) {
    alert("Falscher PIN");
    location.reload();
    return;
  }
  
  isAdmin = pin !== "6969";
  currentUser = isAdmin ? "Admin" : prompt("Dein Name:");
  
  document.getElementById("display-user").textContent = isAdmin ? "👑 Admin" : currentUser;
  document.getElementById("admin-clear").style.display = isAdmin ? "block" : "none";
  
  initChat();
};

async function initChat() {
  unsubscribe = db.collection("messages").orderBy("time", "asc").onSnapshot(snap => {
    const container = document.getElementById("messages");
    container.innerHTML = "";
    
    snap.forEach(doc => {
      const m = doc.data();
      const div = document.createElement("div");
      div.className = `msg ${m.user === currentUser ? "own" : "other"}`;
      const time = new Date(m.time).toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'});
      
      div.innerHTML = `
        <div style="font-size:12.5px; opacity:0.75; margin-bottom:4px;">${m.user} • ${time}</div>
        <div class="msg-bubble">${m.text}</div>
      `;
      container.appendChild(div);
    });
    container.scrollTop = container.scrollHeight;
  });
}

async function sendMessage() {
  const input = document.getElementById("chat-input");
  let text = input.value.trim();
  if (!text) return;

  const cmd = text.toLowerCase().split(" ")[0];
  if (slashCommands[cmd]) {
    const c = slashCommands[cmd];
    if (c.url) openIframe(c.url, c.title);
    input.value = "";
    return;
  }

  await db.collection("messages").add({ user: currentUser, text: text, time: Date.now() });
  input.value = "";
}

function openIframe(url, title) {
  document.getElementById("iframe-title").textContent = title;
  document.getElementById("main-iframe").src = url;
  document.getElementById("iframe-container").style.display = "flex";
}

function closeIframe() {
  document.getElementById("iframe-container").style.display = "none";
  document.getElementById("main-iframe").src = "";
}

function handleKey(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function logout() { location.reload(); }
</script>
</body>
</html>
